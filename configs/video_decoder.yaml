model:
  base_learning_rate: 4.5e-6
  target: ldm.modules.autoencoding.temporal_ae.VideoDecoder
  params:
    scaling_factor: 0.18215
    double_z: True
    z_channels: 4
    resolution: 256
    in_channels: 3
    out_ch: 3
    label_out_ch: 2
    img_out_ch: 1
    ch: 128
    ch_mult: [1,2,4,4] #num_down=len(ch_mult)-1
    num_res_blocks: 2
    attn_resolutions: [16]
    dropout: 0.0
    num_groups: 32
    safetensor_path: stable_diffusion/video_decoder.pt